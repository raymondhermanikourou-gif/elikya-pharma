<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/output.css" />
    <title>Solupharma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body style="font-family: 'Poppins', sans-serif;">
    <header class="bg-green-800 p-6 space-y-7 space-x-7">
    
    <!-- Titre Principal -->
        <div class="flex flex-col items-center text-center mb-6">
    <div>
        <h1 class="text-5xl font-black text-white ">
            SOLU<span class="text-yellow-300">PHARMA</span>
        </h1>
        <p class="text-xl text-white font-bold italic underline">La priorité c'est vous !</p>
    </div>

    <nav class="relative">
        <button class="text-white text-2xl p-2 focus:outline-none hover:scale-110 transition-transform">
            ☰
        </button>
        
       
    </nav>
</div>
        <!-- Barre Médicament -->
         <div class="flex justify-around"  >
        <div class="flex flex-col w-1/3">
            <span class="text-white text-xs font-bold mb-1 ml-2">MÉDICAMENTS</span>
            <div class="relative">
                <input type="text" placeholder="Rechercher un produit..." 
                    class="w-full p-3 rounded-xl shadow-md focus:outline-none border text-white">
                <span class="absolute right-4 top-3 text-emerald-600">🔍</span>
            </div>
        </div>

        <!-- Barre Sang -->
        <div class="flex flex-col w-1/3">
            <span class="text-white text-xs font-bold mb-1 ml-2">SANG (SOS)</span>
            <div class="relative">
                <input type="text" placeholder="Groupe sanguin (A+, O...)" 
                    class="w-full p-3 rounded-xl shadow-md focus:outline-none border text-white">
                <span class="absolute right-4 top-3 text-red-600">🩸</span>
            </div>
        </div>

    </div>
</header>
  </body>
</html>
